<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pokebuilder</title>
  </head>
  <body>
    <!-- Splash screen — rendered by the browser before React boots.
         React removes it via #app-splash { display: none } once ready. -->
    <div id="app-splash" style="
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: hsl(240 6% 7%);
    ">
      <p style="font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; color: hsl(0 0% 95%); margin: 0 0 1.25rem;">
        PokéBuilder
      </p>
      <svg style="width:24px;height:24px;color:hsl(240 5% 46%)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
        <g style="animation:spin 1s linear infinite;transform-origin:center">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </g>
      </svg>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
